name: Fitti
options:
  bundleIdPrefix: com.matthewpark
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  FittiDesign:
    path: FittiDesign
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Fitti:
    type: application
    platform: iOS
    sources:
      - path: Fitti
    dependencies:
      - package: FittiDesign
      - package: FittiDesign
        product: FittiEngine
      - package: Supabase
        product: Supabase
      - target: ShareExtension
    info:
      path: Fitti/Info.plist
      properties:
        CFBundleDisplayName: Fitti
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Without this, ProMotion caps the app at 60fps and every spring in the
        # design system renders as a cheaper version of itself.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: >-
          Fitti uses the camera to photograph your clothes so it can cut them out
          and add them to your closet.
        NSPhotoLibraryUsageDescription: >-
          Fitti adds clothes from photos you choose. It only ever sees the photos
          you pick.
        # Declaring this false skips the export-compliance questionnaire on every
        # TestFlight upload. True only if we ever add non-exempt cryptography;
        # HTTPS alone is exempt.
        ITSAppUsesNonExemptEncryption: false
        # Populated from Secrets.xcconfig, which is gitignored. Absent means the
        # app runs on the local mock, which is a working state rather than a broken one.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fitti
    entitlements:
      path: Fitti/Fitti.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpark.fitti
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

# XcodeGen does not emit a shared scheme unless one is declared, and xcodebuild
# refuses to build without one ("Found no destinations for the scheme").
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Shared with the app rather than duplicated, so the container path and the
      # inbox format cannot drift between the two targets.
      - path: Fitti/Sources/Capture/AppGroup.swift
      - path: Fitti/Sources/Capture/SharedInbox.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Fitti
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpark.fitti.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Fitti:
    build:
      targets:
        Fitti: all
    run:
      config: Debug
      # Lets the paywall be exercised end to end with no App Store Connect record
      # and no sandbox account. Ignored in Release.
      storeKitConfiguration: Fitti.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
