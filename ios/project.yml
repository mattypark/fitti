name: Fitti
options:
  bundleIdPrefix: com.matthewpark
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  FittiDesign:
    path: FittiDesign

targets:
  Fitti:
    type: application
    platform: iOS
    sources:
      - path: Fitti
    dependencies:
      - package: FittiDesign
    info:
      path: Fitti/Info.plist
      properties:
        CFBundleDisplayName: Fitti
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Without this, ProMotion caps the app at 60fps and every spring in the
        # design system renders as a cheaper version of itself.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: >-
          Fitti uses the camera to photograph your clothes so it can cut them out
          and add them to your closet.
        NSPhotoLibraryUsageDescription: >-
          Fitti adds clothes from photos you choose. It only ever sees the photos
          you pick.
        # Declaring this false skips the export-compliance questionnaire on every
        # TestFlight upload. True only if we ever add non-exempt cryptography;
        # HTTPS alone is exempt.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpark.fitti
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

# XcodeGen does not emit a shared scheme unless one is declared, and xcodebuild
# refuses to build without one ("Found no destinations for the scheme").
schemes:
  Fitti:
    build:
      targets:
        Fitti: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
